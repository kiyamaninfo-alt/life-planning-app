<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Planning App - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-slate-100 text-slate-800 font-['Poppins'] overflow-hidden">
    
    <!-- Login Modal (Hidden by default) -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900 bg-opacity-75 z-50 flex items-center justify-center hidden">
        <div id="login-container" class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center">
            <!-- Rendered by AdminAuth -->
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="flex h-screen hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800 text-slate-300 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0 fixed md:relative z-40 h-full" id="sidebar">
            <div class="p-6 flex items-center justify-between border-b border-slate-700">
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-cogs"></i> Admin Panel
                </h1>
                <button id="close-sidebar" class="md:hidden text-slate-400 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1 px-3" id="sidebar-nav">
                    <li>
                        <a href="#" data-tab="overview" class="tab-link active flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 hover:text-white transition-colors bg-indigo-600 text-white">
                            <i class="fas fa-chart-pie w-5"></i> Overview
                        </a>
                    </li>
                    <li>
                        <a href="#" data-tab="tasks" class="tab-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                            <i class="fas fa-tasks w-5"></i> Tasks
                        </a>
                    </li>
                    <li>
                        <a href="#" data-tab="timers" class="tab-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                            <i class="fas fa-stopwatch w-5"></i> Timers
                        </a>
                    </li>
                    <li>
                        <a href="#" data-tab="flows" class="tab-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                            <i class="fas fa-project-diagram w-5"></i> Flows
                        </a>
                    </li>
                    <li>
                        <a href="#" data-tab="widgets" class="tab-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                            <i class="fas fa-layer-group w-5"></i> UI Widgets
                        </a>
                    </li>
                    <li>
                        <a href="#" data-tab="settings" class="tab-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                            <i class="fas fa-cog w-5"></i> Settings
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="p-4 border-t border-slate-700">
                <div class="flex flex-col gap-2 mb-4">
                    <a href="../index.html" class="text-sm text-slate-400 hover:text-white flex items-center gap-2">
                        <i class="fas fa-external-link-alt"></i> Student App
                    </a>
                    <a href="../wosandi/index.html" class="text-sm text-slate-400 hover:text-white flex items-center gap-2">
                        <i class="fas fa-external-link-alt"></i> Wosandi App
                    </a>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-green-500" id="connection-status"></div>
                        <span class="text-sm text-slate-400">Connected</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden w-full bg-slate-50 relative z-10">
            <!-- Header -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-20">
                <div class="flex items-center gap-4">
                    <button id="open-sidebar" class="md:hidden text-slate-500 hover:text-indigo-600">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-xl font-semibold text-slate-800" id="header-title">Overview</h2>
                </div>
                
                <div class="flex items-center gap-4">
                    <button id="logout-btn" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 hover:text-red-600 transition-colors">
                        <i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">Sign Out</span>
                    </button>
                </div>
            </header>

            <!-- Tab Contents -->
            <div class="flex-1 overflow-y-auto p-6" id="main-content">
                
                <!-- Overview Tab -->
                <div id="tab-overview" class="tab-pane active">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl">
                                <i class="fas fa-tasks"></i>
                            </div>
                            <div>
                                <h3 class="text-slate-500 text-sm font-medium">Total Tasks</h3>
                                <p class="text-2xl font-bold text-slate-800" id="stat-tasks">0</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl">
                                <i class="fas fa-stopwatch"></i>
                            </div>
                            <div>
                                <h3 class="text-slate-500 text-sm font-medium">Total Timers</h3>
                                <p class="text-2xl font-bold text-slate-800" id="stat-timers">0</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xl">
                                <i class="fas fa-project-diagram"></i>
                            </div>
                            <div>
                                <h3 class="text-slate-500 text-sm font-medium">Total Flows</h3>
                                <p class="text-2xl font-bold text-slate-800" id="stat-flows">0</p>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl">
                                <i class="fas fa-paper-plane"></i>
                            </div>
                            <div>
                                <h3 class="text-slate-500 text-sm font-medium">Published Items</h3>
                                <p class="text-2xl font-bold text-slate-800" id="stat-published">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                            <h3 class="text-lg font-semibold text-slate-800 mb-4">Quick Actions</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <button onclick="document.querySelector('[data-tab=\'tasks\']').click()" class="p-4 border border-slate-200 rounded-lg hover:bg-indigo-50 hover:border-indigo-200 transition-colors text-left flex flex-col gap-2">
                                    <i class="fas fa-plus-circle text-indigo-500 text-xl"></i>
                                    <span class="font-medium text-slate-700">Add New Task</span>
                                </button>
                                <button onclick="document.querySelector('[data-tab=\'timers\']').click()" class="p-4 border border-slate-200 rounded-lg hover:bg-emerald-50 hover:border-emerald-200 transition-colors text-left flex flex-col gap-2">
                                    <i class="fas fa-clock text-emerald-500 text-xl"></i>
                                    <span class="font-medium text-slate-700">Create Timer</span>
                                </button>
                                <button onclick="document.querySelector('[data-tab=\'flows\']').click()" class="p-4 border border-slate-200 rounded-lg hover:bg-amber-50 hover:border-amber-200 transition-colors text-left flex flex-col gap-2">
                                    <i class="fas fa-sitemap text-amber-500 text-xl"></i>
                                    <span class="font-medium text-slate-700">Build Flow</span>
                                </button>
                                <button onclick="document.querySelector('[data-tab=\'widgets\']').click()" class="p-4 border border-slate-200 rounded-lg hover:bg-blue-50 hover:border-blue-200 transition-colors text-left flex flex-col gap-2">
                                    <i class="fas fa-palette text-blue-500 text-xl"></i>
                                    <span class="font-medium text-slate-700">Manage UI</span>
                                </button>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                            <h3 class="text-lg font-semibold text-slate-800 mb-4">System Status</h3>
                            <div class="space-y-4">
                                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                                    <div class="flex items-center gap-3">
                                        <i class="fas fa-database text-slate-400"></i>
                                        <span class="text-slate-700 font-medium">Database Connection</span>
                                    </div>
                                    <span class="px-2.5 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Online</span>
                                </div>
                                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                                    <div class="flex items-center gap-3">
                                        <i class="fas fa-shield-alt text-slate-400"></i>
                                        <span class="text-slate-700 font-medium">Authentication</span>
                                    </div>
                                    <span class="px-2.5 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Secure</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Other Tabs (Containers for managers) -->
                <div id="tab-tasks" class="tab-pane hidden"></div>
                <div id="tab-timers" class="tab-pane hidden"></div>
                <div id="tab-flows" class="tab-pane hidden"></div>
                <div id="tab-widgets" class="tab-pane hidden"></div>
                <div id="tab-settings" class="tab-pane hidden">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">Publish Management</h3>
                        <div id="publish-container"></div>
                    </div>
                </div>
                
            </div>
        </main>
        
        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-30 hidden md:hidden"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[60] flex flex-col gap-2"></div>

    <script type="module" src="js/adminApp.js?v=20260926-v1"></script>
</body>
</html>
